<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yui · Backend Console</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="assets/console.css"><script type="module" src="assets/console.js"></script></head>
<body>
<a class="skip" href="#content">本文へ移動</a>
<aside class="sidebar"><a class="brand" href="#home"><img src="assets/icon.png" alt="" width="44" height="44"><span class="brand-sub">BACKEND CONSOLE</span></a><nav aria-label="メインナビゲーション" id="nav"></nav><div class="sidebar-bottom"><span class="dot"></span> このPCの管理画面<p>設定変更は保存後に反映します。</p></div></aside>
<main><header><div id="breadcrumb">ワークスペース / ホーム</div><div class="actions"><button id="refresh" class="quiet">状態を更新</button><button id="diagnostics-toggle" class="quiet" aria-expanded="false" aria-controls="diagnostics">実行状況</button></div></header><div id="content" tabindex="-1"><h1>Backendに接続しています</h1><p>現在の設定と準備状態を確認しています。</p></div></main>
<aside id="diagnostics" class="diagnostics" aria-label="実行状況" hidden><div class="diagnostics-head"><div><h2>実行状況</h2></div><button id="diagnostics-close" class="quiet" aria-label="実行状況を閉じる">閉じる</button></div><p class="subtle">応答が遅い、失敗した、違う提供元が使われたときに確認します。</p><div class="diagnostic-filters"><label>処理<select id="event-filter"><option value="all">すべて</option><option value="failed">失敗・代替</option><option value="running">応答待ち</option></select></label><label>期間<select id="event-window"><option value="1800000">直近30分</option><option value="0">この起動中</option></select></label></div><div class="actions"><button id="event-clear-selection" class="link" hidden>他の処理も表示</button><button id="event-pause" class="link" aria-pressed="false">更新を一時停止</button></div><p id="event-status" class="subtle" role="status">読み込み中</p><div id="event-list" class="event-list" tabindex="0" aria-label="処理の記録"></div><p class="subtle diagnostics-foot">記録はこの起動中・最大24時間の一時データです。再起動で消えます。入力本文やキーは含みません。ライブ接続は動作テスト画面で確認します。</p></aside>
<div id="savebar" class="savebar" hidden><span id="save-note">変更はまだ反映されていません</span><button id="discard" class="quiet">変更を戻す</button><button id="save" class="primary">保存して反映</button></div>
<div id="notice" role="status" aria-live="polite" hidden></div>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="actions"><button value="cancel" class="quiet">キャンセル</button><button value="ok" id="confirm-ok" class="primary">続ける</button></div></form></dialog>
<noscript>この管理画面の操作にはJavaScriptが必要です。</noscript>
</body></html>
