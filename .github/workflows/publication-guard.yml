name: Publication Guard

on:
  pull_request:
  push:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run publication guard
        run: python scripts/publication_guard.py --scope tracked --check-git-metadata --check-readme-routing
      - name: Run distribution release audit
        run: python scripts/audit_distribution_release.py --project-root .
